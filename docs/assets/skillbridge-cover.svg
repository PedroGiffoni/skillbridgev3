  <defs><linearGradient id="bg"><stop stop-color="#10234c"/><stop offset="1" stop-color="#45248b"/></linearGradient></defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <g fill="#fff" font-family="Arial, sans-serif">
    <text x="64" y="75" font-size="17" letter-spacing="3">F108 · UNIFOR · MVP ACADÊMICO</text>

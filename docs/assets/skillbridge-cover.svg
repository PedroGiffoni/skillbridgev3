    <text x="64" y="194" font-size="25">Seu próximo passo profissional começa com autoconhecimento.</text>
    <path d="M90 262H1080" stroke="#bba7ff" stroke-width="3"/>
    <g fill="#d7ceff"><circle cx="90" cy="262" r="10"/><circle cx="415" cy="262" r="10"/><circle cx="745" cy="262" r="10"/><circle cx="1080" cy="262" r="10"/></g>
    <g font-size="18"><text x="64" y="310">Profissão</text><text x="345" y="310">Autoavaliação</text><text x="690" y="310">Diagnóstico</text><text x="1015" y="310">4 semanas</text></g>
  </g>
</svg>
